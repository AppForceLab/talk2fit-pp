<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get Talk2Fit — AI Calorie Tracker</title>
  <meta name="description" content="Talk2Fit: say what you ate — AI counts the calories. Download for iPhone or Android.">
  <!-- Smart store resolver (spec 028): one link in every share message,
       resolved to the right store on the RECIPIENT's device. -->
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FBF9F4; color: #2B2B28;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #191A17; color: #F2F1EC; }
    }
    .card { padding: 32px 24px; max-width: 420px; }
    .emoji { font-size: 64px; line-height: 1; }
    h1 { font-size: 26px; margin: 16px 0 8px; }
    p { color: #6F6E68; margin: 0 0 24px; }
    @media (prefers-color-scheme: dark) { p { color: #A5A49C; } }
    .btn {
      display: block; margin: 12px auto; padding: 14px 28px; max-width: 280px;
      border-radius: 999px; background: #7BA876; color: #fff;
      text-decoration: none; font-weight: 600; font-size: 17px;
    }
    .btn.alt { background: transparent; color: inherit; border: 1px solid #8886; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🎤</div>
    <h1>Talk2Fit — AI Calorie Tracker</h1>
    <p>Say what you ate — AI counts the calories in seconds.</p>
    <a class="btn" id="ios"
       href="https://apps.apple.com/app/talk2fit-ai-calorie-tracker/id6775629921">
      Download for iPhone</a>
    <a class="btn alt" id="android"
       href="https://play.google.com/store/apps/details?id=com.intellysoft.talktofit">
      Download for Android</a>
  </div>
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var ios = /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var android = /Android/i.test(ua);
      if (ios) {
        location.replace(document.getElementById('ios').href);
      } else if (android) {
        location.replace(document.getElementById('android').href);
      }
      // Desktop / unknown: stay on the page with both badges.
    })();
  </script>
</body>
</html>
