<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policy — moved to talk2fit.app</title>

<!-- This site has moved to talk2fit.app.

     GitHub Pages serves static files and cannot send a real 301, so this is
     the closest equivalent: a canonical link for search engines, a script
     that redirects immediately, and a meta refresh for anyone without
     JavaScript. The visible link below is what a crawler or a text browser
     is left with, and it works on its own. -->

<link rel="canonical" href="https://talk2fit.app/privacy/">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=https://talk2fit.app/privacy/">
<script>
  // Carry the query string and the fragment across.
  //
  // Both matter and neither survives a meta refresh:
  //   * invite links already sent to people look like /get/?ref=CODE — drop
  //     the query and that referral is gone for good;
  //   * Google Play's account-deletion URL points at #delete-account, and a
  //     landing page without the anchor is a policy problem, not a cosmetic
  //     one.
  location.replace("https://talk2fit.app/privacy/" + location.search + location.hash);
</script>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; margin: 0; display: grid;
         place-items: center; min-height: 100svh; padding: 24px;
         background: #FBF9F4; color: #101410; text-align: center; }
  a { color: #4F7A46; }
</style>
</head>
<body>
  <main>
    <h1>Talk2Fit has a new home</h1>
    <p>This page now lives at <a href="https://talk2fit.app/privacy/">https://talk2fit.app/privacy/</a>.</p>
  </main>
</body>
</html>
