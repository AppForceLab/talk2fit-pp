<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk2Fit</title>
<style>
  :root{--bg:#f6f5ef;--card:#fff;--ink:#1c1c1a;--muted:#6b6b66;--accent:#6f9c6f;--line:#e7e6df}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:720px;margin:0 auto;padding:48px 20px}
  h1{font-size:34px;margin:0 0 6px}
  .tag{color:var(--muted);margin:0 0 32px}
  .grid{display:grid;gap:14px}
  a.card{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;text-decoration:none;color:var(--ink);font-weight:600}
  a.card:hover{border-color:var(--accent)}
  a.card span{color:var(--accent)}
  .foot{margin-top:40px;color:var(--muted);font-size:14px}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Talk2Fit</h1>
  <p class="tag">Voice-first calorie &amp; nutrition tracking.</p>
  <div class="grid">
    <a class="card" href="./support.html">Support &amp; Contact <span>&rsaquo;</span></a>
    <a class="card" href="./privacy.html">Privacy Policy <span>&rsaquo;</span></a>
    <a class="card" href="./terms.html">Terms of Service <span>&rsaquo;</span></a>
  </div>
  <p class="foot">Questions? Email <a href="mailto:talktofit@intellysoft.com">talktofit@intellysoft.com</a>.<br>
  Talk2Fit is developed by Intellysoft.</p>
</div>
</body>
</html>
